name: Release

# Runs on a version tag such as v0.2.0 and creates a DRAFT release.
# Nothing is public until you press "Publish release" on GitHub.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write     # create the draft release
      id-token: write     # sign the build attestation
      attestations: write # store the build attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test -p maxtrix-engine --locked
      - run: cargo build --release -p maxtrix-app --locked
      - name: Build package
        shell: pwsh
        run: ./packaging/package.ps1
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/PortableOrganizer.zip
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$env:TAG" dist/PortableOrganizer.zip --draft --verify-tag --generate-notes --repo "$env:GITHUB_REPOSITORY"
