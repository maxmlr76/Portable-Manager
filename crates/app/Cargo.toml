[package]
name = "maxtrix-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "maxtrix-app"
path = "src/main.rs"

[dependencies]
slint = { version = "1", features = ["raw-window-handle-06"] }
maxtrix-engine = { path = "../engine" }
serde_json = "1"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"
tray-icon = "0.19"
png = "0.17"

[build-dependencies]
slint-build = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
